name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: amine2233/kotlin-ci-shared/.github/workflows/ci.yml@1.0.1
    with:
      enable-lint: true
      enable-title-check: true

  samples-ktor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ktor sample check
        run: ./gradlew -p samples :ktor:check --console=plain
