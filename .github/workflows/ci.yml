# Copy into the consumer repo at: .github/workflows/ci.yml
# Requires a mise.toml with `test` and `lint` tasks (see templates/mise.toml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: amine2233/kotlin-ci-shared/.github/workflows/ci.yml@1.0.1
    with:
      enable-lint: true
      enable-coverage: false
      enable-title-check: true
