name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: amine2233/kotlin-ci-shared/.github/workflows/ci.yml@1.0.1
    with:
      enable-lint: true
      enable-title-check: true
      enable-coverage: true

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Apple tests (macOS arm64, iOS simulator arm64)
        run: ./gradlew macosArm64Test iosSimulatorArm64Test --console=plain
      - name: Compile remaining Apple targets
        run: ./gradlew compileKotlinMacosX64 compileKotlinIosArm64 compileKotlinIosX64 --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-reports
          path: "**/build/reports/tests/"

  samples-ktor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ktor sample check
        run: ./gradlew -p samples :ktor:check --console=plain

  samples-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Android sample build and unit tests
        run: ./gradlew -p samples :android:assembleDebug :android:testDebugUnitTest --console=plain
