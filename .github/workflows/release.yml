# Manual by default (Actions → Release → Run workflow). To release automatically
# on every push to main, set the repository variable AUTO_RELEASE=true.
name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ci:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTO_RELEASE == 'true' }}
    uses: amine2233/kotlin-ci-shared/.github/workflows/ci.yml@1.0.1

  release:
    needs: ci
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    uses: amine2233/kotlin-ci-shared/.github/workflows/semantic-release.yml@1.0.1
    secrets: inherit
