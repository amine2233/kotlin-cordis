<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cordis sample admin</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 48rem; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  #connection { color: #666; font-size: 0.9rem; }
  #failure { color: #a00; white-space: pre-wrap; min-height: 1.2em; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; vertical-align: top; }
  .description { color: #555; font-size: 0.9rem; }
  .error { color: #a00; }
  h2 { font-size: 1.15rem; margin-top: 2rem; }
  h3 { font-size: 1rem; margin-bottom: 0.25rem; }
  #health-state.healthy { color: #070; }
  #health-state.unhealthy { color: #a00; }
  #health-items ul { margin: 0.25rem 0 0.75rem; padding-left: 1.25rem; }
  #health-items li { overflow-wrap: anywhere; }
  pre { background: #f5f5f5; padding: 0.75rem; overflow-x: auto; font-size: 0.85rem; margin: 0; }
  @media (max-width: 480px) {
    thead { display: none; }
    tr { display: flex; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #ddd; padding: 0.5rem 0; }
    td { border-bottom: none; padding: 0.25rem 0.5rem; }
    td:nth-child(1) { order: 1; }
    td:nth-child(3) { order: 2; }
    td:nth-child(3)::before { content: "Status: "; color: #555; }
    td:nth-child(2) { order: 3; flex-basis: 100%; }
    td:nth-child(4) { order: 4; flex-basis: 100%; }
    td.error:empty { display: none; }
  }
</style>
</head>
<body>
<h1>Cordis sample plugins</h1>
<p id="connection" aria-live="polite">Connecting...</p>
<p id="failure" role="alert"></p>
<div class="scroll">
<table>
  <thead>
    <tr><th>Enabled</th><th>Plugin</th><th>Status</th><th>Error</th></tr>
  </thead>
  <tbody id="plugins"></tbody>
</table>
</div>
<section aria-labelledby="health-title">
<h2 id="health-title">Health</h2>
<p id="health-state" aria-live="polite">Loading...</p>
<div id="health-items"></div>
</section>
<section aria-labelledby="graph-title">
<h2 id="graph-title">Graph</h2>
<p id="graph-failure" class="error" role="alert"></p>
<h3>Tree</h3>
<pre id="tree"></pre>
<h3>Mermaid</h3>
<pre id="mermaid"></pre>
</section>
<script>
  const rows = document.getElementById("plugins");
  const connection = document.getElementById("connection");
  const failure = document.getElementById("failure");
  let latest = [];

  // Rows are kept per plugin key and updated in place, so a focused toggle keeps focus across events.
  const views = new Map();

  function createView(key) {
    const row = document.createElement("tr");

    const toggleCell = document.createElement("td");
    const toggle = document.createElement("input");
    toggle.type = "checkbox";
    toggle.addEventListener("change", () => setEnabled(key, toggle.checked));
    toggleCell.appendChild(toggle);

    const about = document.createElement("td");
    const title = document.createElement("strong");
    const description = document.createElement("div");
    description.className = "description";
    about.appendChild(title);
    about.appendChild(description);

    const status = document.createElement("td");
    const error = document.createElement("td");
    error.className = "error";

    row.append(toggleCell, about, status, error);
    return { row, toggle, title, description, status, error };
  }

  function update(view, plugin) {
    view.toggle.checked = plugin.enabled;
    view.toggle.disabled = plugin.metadata.locked;
    view.toggle.setAttribute("aria-label", "Enable " + plugin.metadata.title);
    view.title.textContent = plugin.metadata.title + (plugin.metadata.locked ? " (locked)" : "");
    view.description.textContent = plugin.metadata.description;
    view.status.textContent = plugin.status ?? "Not loaded";
    view.error.textContent = plugin.error ?? "";
  }

  function render(plugins) {
    latest = plugins;
    const keys = plugins.map((plugin) => plugin.key);
    const sameRows = keys.length === views.size && keys.every((key, index) => [...views.keys()][index] === key);
    if (!sameRows) {
      views.clear();
      keys.forEach((key) => views.set(key, createView(key)));
      rows.replaceChildren(...[...views.values()].map((view) => view.row));
    }
    plugins.forEach((plugin) => update(views.get(plugin.key), plugin));
  }

  async function setEnabled(key, enabled) {
    failure.textContent = "";
    try {
      const response = await fetch("/admin/plugins/" + encodeURIComponent(key), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled }),
      });
      if (!response.ok) {
        failure.textContent = "Could not change " + key + ": " + response.status + " " + (await response.text());
        render(latest);
      }
    } catch (error) {
      failure.textContent = "Could not change " + key + ": " + error;
      render(latest);
    }
  }

  const healthState = document.getElementById("health-state");
  const healthItems = document.getElementById("health-items");
  const graphFailure = document.getElementById("graph-failure");
  const tree = document.getElementById("tree");
  const mermaid = document.getElementById("mermaid");
  const healthGroups = [["failed", "Failed"], ["missingServices", "Missing services"], ["pending", "Pending"]];
  let refreshes = 0;

  function describe(item) {
    let text = item.name + (item.key ? " (" + item.key + ")" : "") + ": " + item.status;
    if (item.reason) text += ", " + item.reason;
    if (item.missing.length > 0) text += ", missing " + item.missing.join(", ");
    return text;
  }

  function renderHealth(health) {
    healthState.textContent = health.healthy ? "Healthy" : "Unhealthy";
    healthState.className = health.healthy ? "healthy" : "unhealthy";
    const groups = healthGroups
      .filter(([field]) => health[field].length > 0)
      .flatMap(([field, label]) => {
        const heading = document.createElement("strong");
        heading.textContent = label;
        const list = document.createElement("ul");
        health[field].forEach((item) => {
          const entry = document.createElement("li");
          entry.textContent = describe(item);
          list.appendChild(entry);
        });
        return [heading, list];
      });
    healthItems.replaceChildren(...groups);
  }

  async function fetchText(path) {
    const response = await fetch(path);
    if (!response.ok) throw new Error(path + " answered " + response.status);
    return response.text();
  }

  async function refreshHealth(refresh) {
    try {
      const response = await fetch("/admin/health");
      if (!response.ok && response.status !== 503) throw new Error("/admin/health answered " + response.status);
      const health = await response.json();
      if (refresh === refreshes) renderHealth(health);
    } catch (error) {
      if (refresh !== refreshes) return;
      healthState.textContent = "Could not load health: " + error;
      healthState.className = "";
      healthItems.replaceChildren();
    }
  }

  async function refreshGraph(refresh) {
    try {
      const [treeText, mermaidText] = await Promise.all([fetchText("/admin/snapshot/tree"), fetchText("/admin/snapshot/mermaid")]);
      if (refresh !== refreshes) return;
      graphFailure.textContent = "";
      tree.textContent = treeText;
      mermaid.textContent = mermaidText;
    } catch (error) {
      if (refresh === refreshes) graphFailure.textContent = "Could not load the graph: " + error;
    }
  }

  // Each refresh supersedes the earlier ones, so a slow answer never overwrites a newer one.
  function refreshSnapshot() {
    refreshes += 1;
    refreshHealth(refreshes);
    refreshGraph(refreshes);
  }

  refreshSnapshot();

  const events = new EventSource("/admin/plugins/events");
  events.onopen = () => { connection.textContent = "Live: updates arrive through the event stream."; };
  events.onerror = () => { connection.textContent = "Disconnected; retrying..."; };
  events.onmessage = (event) => {
    render(JSON.parse(event.data));
    refreshSnapshot();
  };
</script>
</body>
</html>
