<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cordis sample admin</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 48rem; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  #connection { color: #666; font-size: 0.9rem; }
  #failure { color: #a00; white-space: pre-wrap; min-height: 1.2em; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; vertical-align: top; }
  .description { color: #555; font-size: 0.9rem; }
  .error { color: #a00; }
</style>
</head>
<body>
<h1>Cordis sample plugins</h1>
<p id="connection">Connecting...</p>
<p id="failure" role="alert"></p>
<table>
  <thead>
    <tr><th>Enabled</th><th>Plugin</th><th>Status</th><th>Error</th></tr>
  </thead>
  <tbody id="plugins"></tbody>
</table>
<script>
  const rows = document.getElementById("plugins");
  const connection = document.getElementById("connection");
  const failure = document.getElementById("failure");
  let latest = [];

  function cell(text, className) {
    const td = document.createElement("td");
    if (className) td.className = className;
    td.textContent = text;
    return td;
  }

  function render(plugins) {
    latest = plugins;
    const fresh = plugins.map((plugin) => {
      const row = document.createElement("tr");

      const toggleCell = document.createElement("td");
      const toggle = document.createElement("input");
      toggle.type = "checkbox";
      toggle.checked = plugin.enabled;
      toggle.disabled = plugin.metadata.locked;
      toggle.setAttribute("aria-label", "Enable " + plugin.metadata.title);
      toggle.addEventListener("change", () => setEnabled(plugin.key, toggle.checked));
      toggleCell.appendChild(toggle);
      row.appendChild(toggleCell);

      const about = document.createElement("td");
      const title = document.createElement("strong");
      title.textContent = plugin.metadata.title + (plugin.metadata.locked ? " (locked)" : "");
      const description = document.createElement("div");
      description.className = "description";
      description.textContent = plugin.metadata.description;
      about.appendChild(title);
      about.appendChild(description);
      row.appendChild(about);

      row.appendChild(cell(plugin.status ?? "Not loaded"));
      row.appendChild(cell(plugin.error ?? "", "error"));
      return row;
    });
    rows.replaceChildren(...fresh);
  }

  async function setEnabled(key, enabled) {
    failure.textContent = "";
    try {
      const response = await fetch("/admin/plugins/" + encodeURIComponent(key), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled }),
      });
      if (!response.ok) {
        failure.textContent = "Could not change " + key + ": " + response.status + " " + (await response.text());
        render(latest);
      }
    } catch (error) {
      failure.textContent = "Could not change " + key + ": " + error;
      render(latest);
    }
  }

  const events = new EventSource("/admin/plugins/events");
  events.onopen = () => { connection.textContent = "Live: updates arrive through the event stream."; };
  events.onerror = () => { connection.textContent = "Disconnected; retrying..."; };
  events.onmessage = (event) => render(JSON.parse(event.data));
</script>
</body>
</html>
